<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#050810" />
    <meta name="description" content="A meditative real-time strategy game in the spirit of Auralux." />
    <!-- Installable to the home screen: launches fullscreen, no browser chrome. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Constellations" />
    <title>Constellations</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #050810;
        color: #cfd6e4;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .ui-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .ui-layer * {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui" class="ui-layer"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
